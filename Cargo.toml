[package]
name         = "pulsar"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.99"
description  = "My firmware for the XIAO ESP32-C5 (ESP-IDF, std)"

[[bin]]
name    = "pulsar"
path    = "src/main.rs"
harness = false # no built-in test harness on the device

[features]
# Lets the secret store work WITHOUT flash/NVS encryption (secrets end up in plain text, with a loud
# warning at boot). For testing before encryption is enabled. Never use it for real secrets.
insecure-dev-store = []

[dependencies]
anyhow            = "1.0.104"
display-interface = "0.5.0"
embedded-graphics = "0.8.2"
esp-idf-svc       = "0.53.0"
heapless          = { version = "0.9.3", features = ["zeroize"] }
# `max_level_info` removes debug/trace logging from the binary, so a debug line inside a
# dependency can never print a Wi-Fi configuration.
log               = { version = "0.4.34", features = ["max_level_info"] }
ssd1306           = "0.10.0"
thiserror         = "2.0.21"
zeroize           = "1.9.1"

[build-dependencies]
embuild = "0.33.7"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.dev]
# The default debug profile is too slow and too big for a microcontroller.
opt-level = "s"
debug = true # symbols do not increase the size on flash

[profile.release]
opt-level     = "z"
lto           = "fat"
codegen-units = 1
panic         = "abort"
