[package]
name         = "pulsar"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.99"
description  = "My firmware for the XIAO ESP32-C5 (ESP-IDF, std)"

[[bin]]
name    = "pulsar"
path    = "src/main.rs"
harness = false # no built-in test harness on the device

[features]
# Lets the secret store work WITHOUT flash/NVS encryption (secrets end up in plain text, with a loud
# warning at boot). For testing before encryption is enabled. Never use it for real secrets.
insecure-dev-store = []

[dependencies]
anyhow            = "1.0.104"
display-interface = "0.5.0"
embedded-graphics = "0.8.2"
esp-idf-svc       = "0.53.0"
esp32-nimble      = "0.13.0"
heapless          = { version = "0.9.3", features = ["zeroize"] }
# `max_level_info` removes debug/trace logging from the binary, so a debug line inside a
# dependency can never print a Wi-Fi configuration.
log               = { version = "0.4.34", features = ["max_level_info"] }
serde             = { version = "1.0.229", features = ["derive"] }
serde_json        = "1.0.154"
ssd1306           = "0.10.0"
thiserror         = "2.0.21"
zeroize           = "1.9.1"

[build-dependencies]
embuild = "0.33.7"

# ESP-IDF 6 no longer ships MQTT in its core tree: it is the managed component `espressif/mqtt`
# (MQTT 3.1.1 and 5.0). Without it `esp_idf_svc::mqtt` is not compiled. The component manager
# writes `components_esp32c5.lock` next to this file; commit it.
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/mqtt", version = "1.1" }

[patch.crates-io]
# esp32-nimble 0.13.0 plus two fixes (a remotely triggerable `todo!()` panic and a data race on
# the subscriber list), see vendor/esp32-nimble/PATCHES.md.
esp32-nimble = { path = "vendor/esp32-nimble" }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.dev]
# The default debug profile is too slow and too big for a microcontroller.
opt-level = "s"
debug = true # symbols do not increase the size on flash

[profile.release]
opt-level     = "z"
lto           = "fat"
codegen-units = 1
panic         = "abort"
