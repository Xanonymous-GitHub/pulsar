[target.riscv32imac-unknown-none-elf]
# Run `cargo run` from the project root: partitions.csv is resolved relative to the current directory.
runner = "espflash flash --monitor --chip esp32c5 --partition-table partitions.csv"

[env]
ESP_LOG = "info"

[build]
rustflags = ["-C", "force-frame-pointers"]
target = "riscv32imac-unknown-none-elf"
