name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Smaller cache, and nothing to gain from incremental state on a fresh runner.
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: cargo-clippy
      - run: cargo clippy --locked -- -D warnings
      - run: cargo clippy --locked --features insecure-dev-store -- -D warnings

  build:
    name: Build (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [dev, release]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: cargo-build-${{ matrix.profile }}
      # No PULSAR_WIFI_* variables here: CI must never see credentials.
      - run: cargo build --locked --profile ${{ matrix.profile }}
      - name: Upload firmware
        if: matrix.profile == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: pulsar-firmware
          path: target/riscv32imac-esp-espidf/release/pulsar
